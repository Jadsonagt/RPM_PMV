<script>
  window.usuarioAtual = null;

  function obterTokenSessao() {
    return sessionStorage.getItem('rpm_session') || '';
  }

  function perfilSomenteLeituraAtual() {
    const nivel = String(window.usuarioAtual && (window.usuarioAtual.nivelAcesso || window.usuarioAtual.nivel) || '').trim().toLowerCase();
    return ['observador', 'observador/controle social'].includes(nivel);
  }

  function perfilObservadorAtual() {
    return String(window.usuarioAtual && (window.usuarioAtual.nivelAcesso || window.usuarioAtual.nivel) || '').trim().toLowerCase() === 'observador';
  }

  function perfilControleSocialAtual() {
    return String(window.usuarioAtual && (window.usuarioAtual.nivelAcesso || window.usuarioAtual.nivel) || '').trim().toLowerCase() === 'observador/controle social';
  }

  function podeAcessarAcompanhamentoAtual() {
    const nivel = String(window.usuarioAtual && (window.usuarioAtual.nivelAcesso || window.usuarioAtual.nivel) || '').trim().toLowerCase();
    return ['admin', 'gestor', 'observador/controle social', 'desenvolvimento'].includes(nivel);
  }

  function usuarioPodeCorrigirCpf() {
    const nivel = String(window.usuarioAtual && (window.usuarioAtual.nivelAcesso || window.usuarioAtual.nivel) || '').trim().toLowerCase();
    return ['admin', 'ti', 'gestor', 'desenvolvimento'].includes(nivel);
  }

  document.addEventListener('DOMContentLoaded', function() {
    // Limpa credenciais deixadas por versões anteriores do sistema.
    localStorage.removeItem('rpm_email');
    localStorage.removeItem('rpm_senha');
    const tokenSessao = sessionStorage.getItem('rpm_session');
    
    if (tokenSessao) {
      google.script.run
        .withSuccessHandler(onLoginSuccess)
        .withFailureHandler(onLoginError)
        .validarSessao(tokenSessao);
    } else {
      // Exibe a tela de login
      const loadingScreen = document.getElementById('loading-screen');
      const loginScreen = document.getElementById('login-screen');
      if (loadingScreen) loadingScreen.classList.add('d-none');
      if (loginScreen) {
        loginScreen.classList.remove('d-none');
        loginScreen.classList.add('d-flex');
      }
    }
  });

  function efetuarLogin() {
    const email = document.getElementById('login-email').value;
    const senha = document.getElementById('login-senha').value;
    const btn = document.getElementById('btn-login');
    const errorContainer = document.getElementById('login-error');
    const errorMsg = document.getElementById('login-error-msg');
    
    if(!email || !senha) return;
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Validando...';
    errorContainer.classList.add('d-none');
    
    google.script.run
      .withSuccessHandler(function(resposta) {
        if(resposta.autenticado) {
          sessionStorage.setItem('rpm_session', resposta.tokenSessao);
          onLoginSuccess(resposta);
        } else {
          errorMsg.textContent = resposta.erro;
          errorContainer.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
        }
      })
      .withFailureHandler(function(erro) {
        errorMsg.textContent = "Erro de conexão. Tente novamente.";
        errorContainer.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
      })
      .validarLoginManual(email, senha);
  }

  function abrirRecuperacaoSenha() {
    const campo = document.getElementById('recuperar-email');
    const emailLogin = document.getElementById('login-email');
    if (campo && emailLogin) campo.value = emailLogin.value || '';
    new bootstrap.Modal(document.getElementById('modalRecuperarSenha')).show();
  }

  function solicitarRecuperacaoSenha() {
    const campo = document.getElementById('recuperar-email');
    const btn = document.getElementById('btn-recuperar-senha');
    const email = campo ? campo.value.trim() : '';
    if (!email) { if (campo) campo.focus(); return; }
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function(resposta) {
        btn.disabled = false;
        const modal = bootstrap.Modal.getInstance(document.getElementById('modalRecuperarSenha'));
        if (modal) modal.hide();
        Swal.fire('Solicitação recebida', resposta.mensagem, 'info');
      })
      .withFailureHandler(function() {
        btn.disabled = false;
        Swal.fire('Solicitação recebida', 'Se houver uma conta vinculada a este e-mail, enviaremos as instruções.', 'info');
      })
      .solicitarRedefinicaoSenha(email);
  }

  function confirmarTrocaSenhaObrigatoria() {
    const nova = document.getElementById('nova-senha-obrigatoria').value;
    const confirmar = document.getElementById('confirmar-senha-obrigatoria').value;
    const btn = document.getElementById('btn-trocar-senha-obrigatoria');
    if (nova.length < 10) { Swal.fire('Senha fraca', 'Use pelo menos 10 caracteres.', 'warning'); return; }
    if (nova !== confirmar) { Swal.fire('Senhas diferentes', 'Confira a confirmação da nova senha.', 'warning'); return; }
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function(resposta) {
        btn.disabled = false;
        if (!resposta.sucesso) { Swal.fire('Erro', resposta.erro, 'error'); return; }
        window.usuarioAtual.trocaSenhaObrigatoria = 'NAO';
        const modal = bootstrap.Modal.getInstance(document.getElementById('modalTrocaSenhaObrigatoria'));
        if (modal) modal.hide();
        Swal.fire('Senha atualizada', 'Sua nova senha foi salva.', 'success');
      })
      .withFailureHandler(function(erro) { btn.disabled = false; Swal.fire('Erro', String(erro), 'error'); })
      .alterarMinhaSenha(nova, obterTokenSessao());
  }

  function fazerLogout() {
    const tokenSessao = sessionStorage.getItem('rpm_session');
    if (tokenSessao) google.script.run.encerrarSessao(tokenSessao);
    sessionStorage.clear();
    window.usuarioAtual = null;
    if (typeof window.dashboardDadosCarregados !== 'undefined') window.dashboardDadosCarregados = false;
    if (typeof window.dashPerfis !== 'undefined') window.dashPerfis = null;
    if (typeof window.dashDadosBrutos !== 'undefined') window.dashDadosBrutos = [];
    
    // Retorna para a tela de login via SPA (evita bugs de redirecionamento em iframe)
    const appContainer = document.getElementById('app-container');
    const loginScreen = document.getElementById('login-screen');
    
    if (appContainer) appContainer.classList.add('d-none');
    const formLogin = document.getElementById('formLogin');
    const btnLogin = document.getElementById('btn-login');
    const erroLogin = document.getElementById('login-error');
    if (formLogin) formLogin.reset();
    if (btnLogin) {
      btnLogin.disabled = false;
      btnLogin.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
    }
    if (erroLogin) erroLogin.classList.add('d-none');
    
    if (loginScreen) {
      loginScreen.classList.remove('d-none');
      loginScreen.classList.add('d-flex');
    }
  }

  function onLoginSuccess(resposta) {
    try {
      const loadingScreen = document.getElementById('loading-screen');
      const loginScreen = document.getElementById('login-screen');
      const appContainer = document.getElementById('app-container');

      if(loadingScreen) {
        loadingScreen.classList.add('d-none');
        loadingScreen.classList.remove('d-flex');
      }
      if(loginScreen) {
        loginScreen.classList.add('d-none');
        loginScreen.classList.remove('d-flex');
      }

      if (resposta && resposta.autenticado) {
        window.usuarioAtual = resposta;
        const perfilSomenteLeitura = perfilSomenteLeituraAtual();

        // Este perfil somente confirma se existe atendimento; nao exibe controles de registro.
        const btnNovoProntuario = document.getElementById('btn-novo-prontuario');
        const btnAdicionarEvolucao = document.getElementById('btn-adicionar-evolucao');
        const btnBuscarProntuario = document.getElementById('btnBuscarProntuario');
        if (btnNovoProntuario) btnNovoProntuario.classList.toggle('d-none', perfilSomenteLeitura);
        if (btnAdicionarEvolucao) btnAdicionarEvolucao.classList.toggle('d-none', perfilSomenteLeitura);
        
        document.getElementById('nav-user-name').textContent = resposta.nome;
        document.getElementById('nav-user-sector').textContent = resposta.setor;
        const indicadorPerfil = document.getElementById('nav-user-profile');
        const nivelVisual = String(resposta.nivelAcesso || resposta.nivel || '').trim().toLowerCase();
        if (indicadorPerfil) {
          const ehDesenvolvimento = nivelVisual === 'desenvolvimento';
          indicadorPerfil.textContent = ehDesenvolvimento ? 'Desenvolvimento / Homologacao' : '';
          indicadorPerfil.classList.toggle('d-none', !ehDesenvolvimento);
        }
        const btnBackup = document.querySelector('[onclick="criarBackupManualFrontend()"]');
        if (btnBackup) btnBackup.classList.toggle('d-none', nivelVisual === 'desenvolvimento');

        // Personalização Visual Dinâmica (Aba SETORES)
        const containerIdentidade = document.getElementById('identidade-setor');
        if (containerIdentidade) {
          if (resposta.corTema) {
            containerIdentidade.style.borderLeftColor = resposta.corTema;
          }
          if (resposta.urlLogo) {
            const imgSetor = document.getElementById('logo-setor-ativo');
            imgSetor.src = resposta.urlLogo;
            imgSetor.classList.remove('d-none');
          }
          document.getElementById('texto-setor-ativo').textContent = `Atuando pela frente: ${resposta.setor}`;
          containerIdentidade.classList.remove('d-none');
        }

        // Valida RBAC para habilitar botão de Dashboard (Gestores Gerais)
        const niveisPainel = ['admin', 'gestor', 'observador', 'desenvolvimento'];
        const nivelUsuario = String(resposta.nivelAcesso || '').trim().toLowerCase();
        const abaGerencial = document.getElementById('btn-tab-dashboard');

        if (abaGerencial) {
            if (niveisPainel.includes(nivelUsuario)) {
                abaGerencial.classList.remove('d-none');
            } else {
                abaGerencial.classList.add('d-none');
            }
        }

        const btnAtendimentos = document.getElementById('btn-tab-atendimentos');
        const btnControleSocial = document.getElementById('btn-tab-controle-social');
        if (btnAtendimentos) btnAtendimentos.classList.toggle('d-none', perfilObservadorAtual() || perfilControleSocialAtual());
        if (btnControleSocial) btnControleSocial.classList.toggle('d-none', !podeAcessarAcompanhamentoAtual());

        // Valida RBAC para habilitar Config. Formulários e Setores (Admin e TI)
        const nivel = resposta.nivelAcesso ? resposta.nivelAcesso.toLowerCase() : '';
        if (nivel === 'admin' || nivel === 'ti' || nivel === 'desenvolvimento') {
          document.getElementById('btn-tab-usuarios').classList.remove('d-none');
          document.getElementById('btn-tab-setores').classList.remove('d-none');
          document.getElementById('btn-tab-formularios').classList.remove('d-none');
        }

        if(appContainer) appContainer.classList.remove('d-none');
        if (perfilObservadorAtual()) alternarAba(null, 'dashboard');
        if (perfilControleSocialAtual()) alternarAba(null, 'controle-social');
        if (String(resposta.trocaSenhaObrigatoria || '').toUpperCase() === 'SIM') {
          new bootstrap.Modal(document.getElementById('modalTrocaSenhaObrigatoria')).show();
        }
        
        configurarEventosViaCep();
      } else {
        if (resposta && resposta.erro) {
          sessionStorage.removeItem('rpm_session');
          const msgEl = document.getElementById('login-error-msg');
          const errorContainer = document.getElementById('login-error');
          if(msgEl && errorContainer) {
            msgEl.textContent = resposta.erro;
            errorContainer.classList.remove('d-none');
          }
        }
        if(loginScreen) {
          loginScreen.classList.remove('d-none');
          loginScreen.classList.add('d-flex');
        }
      }
    } catch (error) {
      console.error("Erro no onLoginSuccess:", error);
      Swal.fire('Erro fatal na inicialização', error.message, 'error');
      const loadingScreen = document.getElementById('loading-screen');
      const loginScreen = document.getElementById('login-screen');
      if(loadingScreen) loadingScreen.classList.add('d-none');
      if(loginScreen) loginScreen.classList.remove('d-none');
    }
  }

  function onLoginError(erro) {
    const msgEl = document.getElementById('login-error-msg');
    const errorContainer = document.getElementById('login-error');
    if (msgEl && errorContainer) {
      msgEl.textContent = `Erro no Servidor: ${erro.message || erro}`;
      errorContainer.classList.remove('d-none');
    }
    const loadingScreen = document.getElementById('loading-screen');
    const loginScreen = document.getElementById('login-screen');
    if(loadingScreen) {
      loadingScreen.classList.add('d-none');
      loadingScreen.classList.remove('d-flex');
    }
    if(loginScreen) {
      loginScreen.classList.remove('d-none');
      loginScreen.classList.add('d-flex');
    }
  }

  // ---- NAVEGAÇÃO DE ABAS ----
  
  function alternarAba(event, abaDestino) {
    if (event) event.preventDefault();
    if (abaDestino === 'atendimentos' && perfilObservadorAtual()) abaDestino = 'dashboard';
    if (perfilControleSocialAtual() && abaDestino !== 'controle-social') abaDestino = 'controle-social';
    if (abaDestino === 'controle-social' && !podeAcessarAcompanhamentoAtual()) abaDestino = 'atendimentos';
    
    const abaAtend = document.getElementById('aba-atendimentos');
    const abaDash = document.getElementById('dashboard-container');
    const abaControleSocial = document.getElementById('controle-social-container');
    const abaUsuarios = document.getElementById('usuarios-container');
    const abaSetores = document.getElementById('setores-container');
    const abaFormularios = document.getElementById('formularios-container');
    
    const btnAtend = document.getElementById('btn-tab-atendimentos');
    const btnDash = document.getElementById('btn-tab-dashboard');
    const btnControleSocial = document.getElementById('btn-tab-controle-social');
    const btnUsuarios = document.getElementById('btn-tab-usuarios');
    const btnSetores = document.getElementById('btn-tab-setores');
    const btnFormularios = document.getElementById('btn-tab-formularios');

    // Reset geral de visibilidade
    if(abaAtend) { abaAtend.classList.add('d-none'); abaAtend.style.display = ''; }
    if(abaDash) { abaDash.classList.add('d-none'); abaDash.style.display = ''; }
    if(abaControleSocial) { abaControleSocial.classList.add('d-none'); abaControleSocial.style.display = ''; }
    if(abaUsuarios) { abaUsuarios.classList.add('d-none'); abaUsuarios.style.display = ''; }
    if(abaSetores) { abaSetores.classList.add('d-none'); abaSetores.style.display = ''; }
    if(abaFormularios) { abaFormularios.classList.add('d-none'); abaFormularios.style.display = ''; }
    
    if(btnAtend) btnAtend.classList.remove('active');
    if(btnDash) btnDash.classList.remove('active');
    if(btnControleSocial) btnControleSocial.classList.remove('active');
    if(btnUsuarios) btnUsuarios.classList.remove('active');
    if(btnSetores) btnSetores.classList.remove('active');
    if(btnFormularios) btnFormularios.classList.remove('active');

    if (abaDestino === 'atendimentos') {
      if(abaAtend) abaAtend.classList.remove('d-none');
      if(btnAtend) btnAtend.classList.add('active');
    } else if (abaDestino === 'dashboard') {
      if(abaDash) abaDash.classList.remove('d-none');
      if(btnDash) btnDash.classList.add('active');
      carregarDashboard();
    } else if (abaDestino === 'controle-social') {
      if(abaControleSocial) abaControleSocial.classList.remove('d-none');
      if(btnControleSocial) btnControleSocial.classList.add('active');
      carregarAcompanhamentoControleSocial();
    } else if (abaDestino === 'usuarios') {
      if(abaUsuarios) { abaUsuarios.classList.remove('d-none'); abaUsuarios.style.display = 'block'; }
      if(btnUsuarios) btnUsuarios.classList.add('active');
      carregarTabelaUsuarios();
    } else if (abaDestino === 'setores') {
      if(abaSetores) { abaSetores.classList.remove('d-none'); abaSetores.style.display = 'block'; }
      if(btnSetores) btnSetores.classList.add('active');
      carregarTabelaSetores();
    } else if (abaDestino === 'formularios') {
      if(abaFormularios) { abaFormularios.classList.remove('d-none'); abaFormularios.style.display = 'block'; }
      if(btnFormularios) btnFormularios.classList.add('active');
      carregarConfigFormularios();
    }
  }

  // ---- MOTOR DE FORMULÁRIOS DINÂMICOS (Frontend) ----
  
  /**
   * Busca os campos ativos para o usuário logado e renderiza os inputs no modal.
   */
  function configurarFormularioDinamico(email) {
    const container = document.getElementById('campos-dinamicos-container');
    if (!container) return;
    
    container.innerHTML = '<p class="text-muted small"><span class="spinner-border spinner-border-sm me-1"></span>Carregando campos do seu órgão...</p>';

    if (!email) {
       container.innerHTML = '<p class="text-danger small"><i class="bi bi-exclamation-triangle me-1"></i>Erro: Usuário não identificado.</p>';
       return;
    }

    google.script.run
      .withSuccessHandler(function(campos) {
        if (campos && campos.status === 'erro') {
          container.innerHTML = '<p class="text-danger small"><i class="bi bi-exclamation-triangle me-1"></i>Erro ao carregar campos: ' + campos.mensagem + '</p>';
          return;
        }
        if (!campos || campos.length === 0) {
          container.innerHTML = '<p class="text-muted small"><i class="bi bi-info-circle me-1"></i>Nenhum campo específico configurado para o seu setor.</p>';
          return;
        }
        
        let html = '';
        campos.forEach(campo => {
          const colClass = campo.tipo === 'textarea' ? 'col-12' : 'col-md-6';
          html += `<div class="${colClass}">`;
          
          let badgeHtml = '';
          if (campo.setoresBadge) {
            badgeHtml = `<span class="badge bg-info text-dark ms-2" style="font-size: 0.65em;">${campo.setoresBadge}</span>`;
          }
          
          html += `<label class="form-label">${campo.label}${badgeHtml}</label>`;
          
          const ehCampoAtendimentoCreas = String(campo.label).trim().toLowerCase() === 'atendimento creas' && String(window.usuarioAtual && window.usuarioAtual.setor || '').trim().toLowerCase() === 'creas';
          if (campo.tipo === 'text' || campo.tipo === 'number' || campo.tipo === 'date') {
            const controleContrarreferencia = ehCampoAtendimentoCreas;
            const evento = controleContrarreferencia ? ' oninput="atualizarDestinoContrarreferencia(this.value)"' : '';
            html += `<input type="${campo.tipo}" class="form-control dynamic-input" name="${campo.label}"${evento}>`;
          } else if (campo.tipo === 'textarea') {
            html += `<textarea class="form-control dynamic-input" name="${campo.label}" rows="2"></textarea>`;
          } else if (campo.tipo === 'select') {
            const evento = ehCampoAtendimentoCreas ? ' onchange="atualizarDestinoContrarreferencia(this.value)"' : '';
            html += `<select class="form-select dynamic-input" name="${campo.label}"${evento}>`;
            html += `<option value="">Selecione...</option>`;
            if (campo.opcoes) {
              const arrayOpcoes = campo.opcoes.split(',');
              arrayOpcoes.forEach(opt => {
                const optTrim = opt.trim();
                if(optTrim) html += `<option value="${optTrim}">${optTrim}</option>`;
              });
            } else {
              html += `<option value="Sim">Sim</option><option value="Não">Não</option>`;
            }
            html += `</select>`;
          }
          
          html += `</div>`;
          if (ehCampoAtendimentoCreas) {
            html += `<div class="col-md-6 d-none" id="destino-contrarreferencia-container">
              <label class="form-label">Destino da contrarreferência</label>
              <select class="form-select dynamic-input" name="Destino da Contrarreferência" id="destino-contrarreferencia">
                <option value="">Selecione...</option>
                <option value="CRAS Promorar">CRAS Promorar</option>
                <option value="CRAS Jardim Tatiana">CRAS Jardim Tatiana</option>
                <option value="CRAS Itapeva">CRAS Itapeva</option>
                <option value="Equipe Técnica da SECI">Equipe Técnica da SECI</option>
              </select>
            </div>`;
          }
        });
        container.innerHTML = html;
      })
      .withFailureHandler(function(erro) {
        container.innerHTML = '<p class="text-danger small"><i class="bi bi-exclamation-triangle me-1"></i>Erro ao carregar campos: ' + erro + '</p>';
      })
      .buscarCamposFormulario(email, obterTokenSessao());
  }

  function mascaraCPFAlfanumerico(event) {
    let valor = event.target.value.replace(/\D/g, '');
    valor = valor.substring(0, 11);
    
    if (valor.length > 9) {
      event.target.value = valor.replace(/^([A-Z0-9]{3})([A-Z0-9]{3})([A-Z0-9]{3})([A-Z0-9]{1,2}).*/, '$1.$2.$3-$4');
    } else if (valor.length > 6) {
      event.target.value = valor.replace(/^([A-Z0-9]{3})([A-Z0-9]{3})([A-Z0-9]{1,3}).*/, '$1.$2.$3');
    } else if (valor.length > 3) {
      event.target.value = valor.replace(/^([A-Z0-9]{3})([A-Z0-9]{1,3}).*/, '$1.$2');
    } else {
      event.target.value = valor;
    }
  }

  // Campos imutáveis: bloqueados após busca bem-sucedida (LGPD)
  const CAMPOS_IMUTAVEIS = ['inputCpf', 'inputNome', 'inputRg', 'inputNascimento', 'inputIdade', 'inputRacaCor'];
  // Campos mutáveis: podem ser desbloqueados pelo botão lápis
  const CAMPOS_MUTAVEIS  = ['tel_fixo', 'tel_celular', 'cep_vitima', 'rua_vitima', 'num_vitima', 'bairro_vitima',
                            'inputNomeSocial', 'inputPreferenciaExibicao', 'inputEscolaridade', 'inputRenda', 'inputPossuiBeneficio', 'inputBolsa', 'inputBpc',
                            'inputAluguelSocialMunicipal', 'inputAluguelSocialEstadual', 'inputOutroBeneficio',
                            'inputOutroBeneficioDescricao', 'inputMoradia'];

  function obterConfiguracaoBeneficios(prefixo) {
    return prefixo === 'cad'
      ? { possui: 'cad_possui_beneficio', opcoes: 'cad-beneficios-opcoes', outro: 'cad_outro_beneficio', outroContainer: 'cad-outro-beneficio-container', descricao: 'cad_outro_beneficio_descricao', tags: 'cad-outro-beneficio-tags', sugestao: 'cad_outro_beneficio_sugestao', texto: 'cad_outro_beneficio_texto', bolsa: 'cad_bolsa', bpc: 'cad_bpc', municipal: 'cad_aluguel_social_municipal', estadual: 'cad_aluguel_social_estadual' }
      : { possui: 'inputPossuiBeneficio', opcoes: 'input-beneficios-opcoes', outro: 'inputOutroBeneficio', outroContainer: 'input-outro-beneficio-container', descricao: 'inputOutroBeneficioDescricao', tags: 'input-outro-beneficio-tags', sugestao: 'inputOutroBeneficioSugestao', texto: 'inputOutroBeneficioTexto', bolsa: 'inputBolsa', bpc: 'inputBpc', municipal: 'inputAluguelSocialMunicipal', estadual: 'inputAluguelSocialEstadual' };
  }

  function atualizarVisibilidadeBeneficios(prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const possui = document.getElementById(cfg.possui);
    const opcoes = document.getElementById(cfg.opcoes);
    const outro = document.getElementById(cfg.outro);
    const outroContainer = document.getElementById(cfg.outroContainer);
    const descricao = document.getElementById(cfg.descricao);
    const exibirOpcoes = possui.value === 'Sim';
    opcoes.classList.toggle('d-none', !exibirOpcoes);
    if (!exibirOpcoes) {
      outroContainer.classList.add('d-none');
      descricao.required = false;
      if (possui.value === 'Não') {
        [cfg.bolsa, cfg.bpc, cfg.municipal, cfg.estadual, cfg.outro].forEach(id => { document.getElementById(id).checked = false; });
        descricao.value = '';
        renderizarBeneficiosOutro(prefixo);
      }
      return;
    }
    outroContainer.classList.toggle('d-none', !outro.checked);
    descricao.required = false;
    if (!outro.checked) descricao.value = '';
    renderizarBeneficiosOutro(prefixo);
  }

  function obterItensBeneficiosOutro(prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    return document.getElementById(cfg.descricao).value.split(';').map(item => item.trim()).filter(Boolean);
  }

  function definirItensBeneficiosOutro(prefixo, itens) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const vistos = new Set();
    const padronizados = itens.map(item => item.trim()).filter(item => {
      const chave = item.toLocaleLowerCase('pt-BR');
      if (!item || vistos.has(chave)) return false;
      vistos.add(chave);
      return true;
    });
    document.getElementById(cfg.descricao).value = padronizados.join('; ');
    renderizarBeneficiosOutro(prefixo);
  }

  function renderizarBeneficiosOutro(prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const itens = obterItensBeneficiosOutro(prefixo);
    const container = document.getElementById(cfg.tags);
    const sugestao = document.getElementById(cfg.sugestao);
    const texto = document.getElementById(cfg.texto);
    const bloqueado = sugestao.disabled || texto.disabled;
    container.innerHTML = '';
    itens.forEach((item, indice) => {
      const etiqueta = document.createElement('span');
      etiqueta.className = 'badge rounded-pill text-bg-primary d-inline-flex align-items-center gap-2 py-2 px-3';
      const nome = document.createElement('span');
      nome.textContent = item;
      const remover = document.createElement('button');
      remover.type = 'button';
      remover.className = 'btn-close btn-close-white';
      remover.setAttribute('aria-label', `Remover ${item}`);
      remover.disabled = bloqueado;
      remover.addEventListener('click', () => {
        const novosItens = obterItensBeneficiosOutro(prefixo);
        novosItens.splice(indice, 1);
        definirItensBeneficiosOutro(prefixo, novosItens);
      });
      etiqueta.append(nome, remover);
      container.appendChild(etiqueta);
    });
    Array.from(sugestao.options).forEach(opcao => {
      if (opcao.value) opcao.disabled = itens.some(item => item.toLocaleLowerCase('pt-BR') === opcao.value.toLocaleLowerCase('pt-BR'));
    });
  }

  function adicionarBeneficioOutroDaLista(prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const sugestao = document.getElementById(cfg.sugestao);
    if (!sugestao.value) return;
    definirItensBeneficiosOutro(prefixo, [...obterItensBeneficiosOutro(prefixo), sugestao.value]);
    sugestao.value = '';
  }

  function adicionarBeneficioOutroDigitado(prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const texto = document.getElementById(cfg.texto);
    const novosItens = texto.value.split(/[;,\n]+/).map(item => item.trim()).filter(Boolean);
    if (!novosItens.length) return;
    definirItensBeneficiosOutro(prefixo, [...obterItensBeneficiosOutro(prefixo), ...novosItens]);
    texto.value = '';
    texto.focus();
  }

  function adicionarBeneficioOutroPorTecla(evento, prefixo) {
    if (evento.key !== 'Enter') return;
    evento.preventDefault();
    adicionarBeneficioOutroDigitado(prefixo);
  }

  function validarBeneficioOutro(prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    if (document.getElementById(cfg.outro).checked && !obterItensBeneficiosOutro(prefixo).length) {
      Swal.fire('Informe o outro benefício', 'Escolha um programa da lista ou digite o benefício antes de salvar.', 'warning');
      return false;
    }
    return true;
  }

  function preencherBeneficios(prefixo, dados) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const valores = { bolsa: dados.bolsa_familia === 'Sim', bpc: dados.bpc === 'Sim', municipal: dados.aluguel_social_municipal === 'Sim', estadual: dados.aluguel_social_estadual === 'Sim', outro: dados.outro_beneficio_social === 'Sim' || Boolean(dados.descricao_outro_beneficio_social) };
    document.getElementById(cfg.bolsa).checked = valores.bolsa;
    document.getElementById(cfg.bpc).checked = valores.bpc;
    document.getElementById(cfg.municipal).checked = valores.municipal;
    document.getElementById(cfg.estadual).checked = valores.estadual;
    document.getElementById(cfg.outro).checked = valores.outro;
    document.getElementById(cfg.descricao).value = dados.descricao_outro_beneficio_social || '';
    const possuiDadosRegistrados = ['bolsa_familia', 'bpc', 'aluguel_social_municipal', 'aluguel_social_estadual', 'outro_beneficio_social', 'descricao_outro_beneficio_social'].some(campo => Boolean(dados[campo]));
    document.getElementById(cfg.possui).value = dados.possui_beneficio_social || (Object.values(valores).some(Boolean) ? 'Sim' : (possuiDadosRegistrados ? 'Não' : ''));
    atualizarVisibilidadeBeneficios(prefixo);
  }

  function incluirDadosBeneficios(dadosObj, prefixo) {
    const cfg = obterConfiguracaoBeneficios(prefixo);
    const possui = document.getElementById(cfg.possui).value;
    dadosObj['Possui Benefício Social'] = possui;
    dadosObj['Bolsa Família'] = possui === 'Sim' && document.getElementById(cfg.bolsa).checked ? 'Sim' : 'Não';
    dadosObj['BPC'] = possui === 'Sim' && document.getElementById(cfg.bpc).checked ? 'Sim' : 'Não';
    dadosObj['Aluguel Social Municipal'] = possui === 'Sim' && document.getElementById(cfg.municipal).checked ? 'Sim' : 'Não';
    dadosObj['Aluguel Social Estadual'] = possui === 'Sim' && document.getElementById(cfg.estadual).checked ? 'Sim' : 'Não';
    const temOutro = possui === 'Sim' && document.getElementById(cfg.outro).checked;
    dadosObj['Outro Benefício Social'] = temOutro ? 'Sim' : 'Não';
    dadosObj['Descrição de Outro Benefício Social'] = temOutro ? document.getElementById(cfg.descricao).value.trim() : '';
  }

  function _bloquearTudo() {
    [...CAMPOS_IMUTAVEIS, ...CAMPOS_MUTAVEIS].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.readOnly = true;

    });

  function _liberarTudo() {
    [...CAMPOS_IMUTAVEIS, ...CAMPOS_MUTAVEIS].forEach(id => {

      el.readOnly = false;

  function calcularIdadeVitima() {
    const dataNasc = document.getElementById('inputNascimento').value;
    if (!dataNasc) {
      document.getElementById('inputIdade').value = '';
      return;
    }
    const hoje = new Date();
    const nascimento = new Date(dataNasc);
    let idade = hoje.getFullYear() - nascimento.getFullYear();
    const m = hoje.getMonth() - nascimento.getMonth();
    if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate() + 1)) {
      idade--;
    }
    document.getElementById('inputIdade').value = idade >= 0 ? idade : '';
  }

  function mascararCpf(cpf) {
    const digitos = String(cpf || '').replace(/\D/g, '');
    return digitos.length === 11 ? '***.***.' + digitos.slice(6, 9) + '-' + digitos.slice(9) : 'Dado protegido';
  }

  function formatarCpfCompleto(cpf) {
    const digitos = String(cpf || '').replace(/\D/g, '').substring(0, 11);
    if (digitos.length !== 11) return String(cpf || '');
    return digitos.slice(0, 3) + '.' + digitos.slice(3, 6) + '.' + digitos.slice(6, 9) + '-' + digitos.slice(9);
  }

  function cpfEhValido(cpf) {
    const numeros = String(cpf || '').replace(/\D/g, '');
    if (!/^\d{11}$/.test(numeros) || /^(\d)\1{10}$/.test(numeros)) return false;
    const calcularDigito = function(base, pesoInicial) {
      let soma = 0;
      for (let i = 0; i < base.length; i++) soma += Number(base.charAt(i)) * (pesoInicial - i);
      const resto = (soma * 10) % 11;
      return resto === 10 ? 0 : resto;
    };
    const primeiro = calcularDigito(numeros.substring(0, 9), 10);
    const segundo = calcularDigito(numeros.substring(0, 9) + primeiro, 11);
    return Number(numeros.charAt(9)) === primeiro && Number(numeros.charAt(10)) === segundo;
  }

  function mensagemValidacaoCpf(cpf) {
    const numeros = String(cpf || '').replace(/\D/g, '');
    if (numeros.length !== 11) {
      return 'Digite os 11 n\u00fameros do CPF. Os pontos e o h\u00edfen s\u00e3o adicionados automaticamente.';
    }
    return 'O CPF informado possui 11 n\u00fameros, mas os d\u00edgitos verificadores n\u00e3o conferem. Confira o documento.';
  }

  function atualizarDestinoContrarreferencia(status) {
    const container = document.getElementById('destino-contrarreferencia-container');
    if (!container) return;
    const statusNormalizado = String(status || '').trim().toLocaleLowerCase('pt-BR').replace(/[-\s]/g, '');
    const exibir = statusNormalizado === 'contrareferenciado' || statusNormalizado === 'contrarreferenciado';
    container.classList.toggle('d-none', !exibir);
    if (!exibir) document.getElementById('destino-contrarreferencia').value = '';
  }

  function mascararNome(nome) {
    return String(nome || '').split(/\s+/).filter(Boolean).map(parte => parte.charAt(0) + '*'.repeat(Math.max(2, parte.length - 1))).join(' ');
  }

  function mascararRg(rg) {
    const valor = String(rg || '');
    return valor.length > 4 ? '**.***.' + valor.slice(-4) : 'Dado protegido';
  }

  function formatarDataExibicao(data) {
    const texto = String(data || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {
      const partes = texto.split('-');
      return partes[2] + '/' + partes[1] + '/' + partes[0];
    }
    return texto;
  }

  function pesquisarCpf() {
    const btn = document.getElementById('btnBuscarCpf');
    const cpf = document.getElementById('inputCpf').value.trim();
    const idVitimaOculto = document.getElementById('idVitimaOculto');

    if (!cpf) { Swal.fire('Atenção', 'Informe o CPF.', 'warning'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    document.getElementById('inputNome').value = 'Buscando...';

    google.script.run
      .withSuccessHandler(function(resultado) {
        btn.disabled = false; btn.innerHTML = 'Buscar';

        if (resultado) {
          // --- VÍTIMA EXISTENTE ---
          idVitimaOculto.value = resultado.idVitima;

          // Limpa avisos antigos
          document.querySelectorAll('.aviso-lgpd').forEach(el => el.remove());

          // Preenche todos os campos
          document.getElementById('inputCpf').dataset.valorOriginal = cpf;
          document.getElementById('inputCpf').value = mascararCpf(cpf);
          document.getElementById('inputNome').value = mascararNome(resultado.nome);
          document.getElementById('inputNomeSocial').value = resultado.nome_social || '';
          document.getElementById('inputPreferenciaExibicao').value = resultado.preferencia_exibicao || 'Nome de registro';
          document.getElementById('inputNascimento').type = 'date';
          document.getElementById('inputNascimento').value = resultado.nascimento || '';
          
          // Mascara o RG (Ex: **.***.901-2)
          let rgOriginal = resultado.rg || '';
          let rgMascarado = rgOriginal.length > 4 ? `**.***.${rgOriginal.slice(-4)}` : rgOriginal;
          document.getElementById('inputRg').value = rgMascarado;

          // Adiciona avisos LGPD nos containers
          const avisoHtml = `<small class="text-danger fw-bold d-block mt-1 aviso-lgpd"><i class="bi bi-lock-fill"></i> Dados protegidos pela LGPD</small>`;
          document.getElementById('cpf-container').insertAdjacentHTML('afterend', avisoHtml);
          document.getElementById('nome-container').insertAdjacentHTML('beforeend', avisoHtml);
          document.getElementById('rg-container').insertAdjacentHTML('beforeend', avisoHtml);
          document.getElementById('raca-container').insertAdjacentHTML('beforeend', avisoHtml);

          document.getElementById('tel_fixo').value = resultado.tel_fixo || '';
          document.getElementById('tel_celular').value = resultado.tel_celular || '';
          document.getElementById('cep_vitima').value = resultado.cep || '';
          document.getElementById('rua_vitima').value = resultado.logradouro || '';
          document.getElementById('num_vitima').value = resultado.numero || '';
          document.getElementById('bairro_vitima').value = resultado.bairro || '';
          if (resultado.cep && (!resultado.logradouro || !resultado.bairro)) {
            preencherEnderecoPorCep(resultado.cep, true, false);
          }
          const campoRaca = document.getElementById('inputRacaCor');
          campoRaca.value = '';
          campoRaca.options[0].text = 'Dado protegido';
          document.getElementById('inputIdade').value = resultado.idade || '';
          document.getElementById('inputEscolaridade').value = resultado.escolaridade || '';
          document.getElementById('inputRenda').value = resultado.renda || '';
          preencherBeneficios('input', resultado);
          document.getElementById('inputMoradia').value = resultado.moradia || '';

          // Bloqueia TODOS os campos (fundo cinza da regra CSS)
          _bloquearTudo();

          Swal.fire({ title: 'Cadastro localizado!', text: `Dados de ${resultado.nome_exibicao || resultado.nome || 'Vítima'} carregados. Você pode atualizar contato, endereço e perfil socioeconômico.`, icon: 'success', timer: 3000, showConfirmButton: false });
        } else {
          // --- NOVA VÍTIMA ---
          idVitimaOculto.value = 'NOVO';
          document.getElementById('formAtendimento').reset();
          document.getElementById('inputCpf').value = cpf; // restaura o CPF digitado
          atualizarVisibilidadeBeneficios('input');
          _liberarTudo();
          Swal.fire({ title: 'Nova Vítima', text: 'CPF não encontrado. Preencha os dados para cadastro.', icon: 'info', timer: 3000, showConfirmButton: false });
        }
      })
      .withFailureHandler(function(erro) {
        btn.disabled = false; btn.innerHTML = 'Buscar';
        document.getElementById('inputNome').value = '';
        Swal.fire('Erro', String(erro), 'error');
      })
      .buscarVitimaPorCpf(cpf, obterTokenSessao());
  }

  function enviarFormulario() {
    const form = document.getElementById('formAtendimento');
    if (!validarBeneficioOutro('input')) return;
    const destinoContrarreferencia = document.getElementById('destino-contrarreferencia');
    if (destinoContrarreferencia && !document.getElementById('destino-contrarreferencia-container').classList.contains('d-none') && !destinoContrarreferencia.value) {
      Swal.fire('Atenção', 'Selecione o destino da contrarreferência.', 'warning');
      return;
    }
    
    // Passo 4: Se a seção está oculta (fluxo de evolução), usa o CPF hidden
    const cpfHidden = document.getElementById('cpf-evolucao-hidden').value;
    const secaoOculta = document.getElementById('secao-dados-vitima').classList.contains('d-none');
    if (secaoOculta && cpfHidden) {
      document.getElementById('inputCpf').value = cpfHidden;
    }
    
    if (!document.getElementById('idVitimaOculto').value) {
      Swal.fire('Atenção', 'Não foi possível identificar a vítima. Tente novamente.', 'warning'); return;
    }

    const btn = document.getElementById('btnSalvarAtendimento');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando...';

    // Coleta TODOS os campos do form (fixos + dinâmicos gerados pelo motor)
    const dadosObj = { 
      'Órgão de Origem': window.usuarioAtual.setor,
      '_usuarioLogado': window.usuarioAtual.nome || window.usuarioAtual.email
    };
    
    const formData = new FormData(form);
    for (const [key, value] of formData.entries()) {
      if (value) dadosObj[key] = value;
    }
    incluirDadosBeneficios(dadosObj, 'input');
    dadosObj['Composição Familiar'] = obterComposicaoFamiliar();
    dadosObj['CPF'] = document.getElementById('inputCpf').dataset.valorOriginal || dadosObj['CPF'];
    // Garante CPF mesmo com seção oculta
    if (!dadosObj['CPF'] && cpfHidden) dadosObj['CPF'] = cpfHidden;
    const criandoNovoProntuario = document.getElementById('idVitimaOculto').value === 'NOVO';
    if (criandoNovoProntuario && !cpfEhValido(dadosObj['CPF'])) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-save me-1"></i> Salvar Atendimento';
      Swal.fire('CPF inválido', 'Confira os 11 dígitos do CPF antes de criar um novo prontuário.', 'warning');
      return;
    }
    if (window.confirmacaoDuplicidadePendente) {
      dadosObj['_confirmarPossivelDuplicidade'] = true;
      window.confirmacaoDuplicidadePendente = false;
    }

    google.script.run
      .withSuccessHandler(function(resposta) {
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i> Salvar Atendimento';
        if (resposta.sucesso) {
          // a) Fecha o modal programaticamente
          const modalEl = document.getElementById('modalNovoAtendimento');
          const modalInst = bootstrap.Modal.getInstance(modalEl);
          if (modalInst) modalInst.hide();
          
          // b) Exibe alerta visual
          Swal.fire({
            title: 'Sucesso!',
            text: resposta.tipo === 'cadastro_atualizado'
              ? 'Cadastro atualizado. Nenhum atendimento foi incluído no histórico.'
              : 'Atendimento salvo com sucesso.',
            icon: 'success',
            timer: 2500,
            showConfirmButton: false
          });

          // c) Atualiza a tela (Recarrega o histórico sem F5)
          const cpfAtual = dadosObj['CPF'] || document.getElementById('inputCpf').value || document.getElementById('inputCpfProntuario').value;
          if (cpfAtual) {
            document.getElementById('inputCpfProntuario').value = cpfAtual;
            pesquisarProntuarioHome();
          }
        } else if (resposta.codigo === 'POSSIVEL_DUPLICIDADE') {
          const criterios = (resposta.motivos || []).join('; ');
          Swal.fire({
            title: 'Possível prontuário duplicado',
            html: 'Encontramos um cadastro com coincidência de <strong>' + criterios + '</strong>.<br><br>Confira o CPF informado. Se tiver certeza de que se trata de outra pessoa, confirme para prosseguir.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Confirmar novo cadastro',
            cancelButtonText: 'Revisar CPF',
            confirmButtonColor: '#b45309'
          }).then(function(resultado) {
            if (resultado.isConfirmed) {
              window.confirmacaoDuplicidadePendente = true;
              enviarFormulario();
            }
          });
        } else {
          Swal.fire('Erro', resposta.erro, 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i> Salvar Atendimento';
        Swal.fire('Erro no servidor', String(e), 'error');
      })
      .salvarAtendimento(dadosObj, obterTokenSessao());
  }

  // --- LÓGICA DE RASCUNHO E DATAS ---
  function inicializarModalAtendimento() {
    if(window.usuarioAtual && window.usuarioAtual.email) {
      configurarFormularioDinamico(window.usuarioAtual.email);
    }
    
    const hoje = new Date().toLocaleDateString('en-CA');
    const inputDataCad = document.getElementById('data_cadastro');
    const inputDataOco = document.getElementById('data_ocorrencia');
    if(inputDataCad) inputDataCad.value = hoje;
    if(inputDataOco && !inputDataOco.value) inputDataOco.value = hoje;

    try {
      const rascunho = JSON.parse(localStorage.getItem('rascunhoAtendimentoRPM') || '{}');
      if (rascunho.relato) document.getElementById('inputRelato').value = rascunho.relato;
      if (rascunho.data_ocorrencia) document.getElementById('data_ocorrencia').value = rascunho.data_ocorrencia;
      if (rascunho.cpf) {
        document.getElementById('inputCpf').value = rascunho.cpf;
      }
    } catch (e) {
      console.warn("Erro ao recuperar rascunho", e);
    }
  }

  function salvarRascunhoAtendimento() {
    const dados = {
      cpf: document.getElementById('inputCpf').value,
      relato: document.getElementById('inputRelato').value,
      data_ocorrencia: document.getElementById('data_ocorrencia').value
    };
    localStorage.setItem('rascunhoAtendimentoRPM', JSON.stringify(dados));
  }

  function confirmarFechamentoAtendimento() {
    const temDados = document.getElementById('inputRelato').value.trim() !== '' || document.getElementById('inputCpf').value.trim() !== '';
    
    if (temDados) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "Os dados não salvos serão perdidos.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sim, fechar',
        cancelButtonText: 'Continuar editando'
      }).then((result) => {
        if (result.isConfirmed) {
          fecharE_LimparModalAtendimento();
        }
      });
    } else {
      fecharE_LimparModalAtendimento();
    }
  }

    const modalEl = document.getElementById('modalNovoAtendimento');
    const modalInst = bootstrap.Modal.getInstance(modalEl);
    if (modalInst) modalInst.hide();
  }

          input.readOnly = false;
          input.disabled = false;
        });
        
        // c) Remove avisos LGPD

        // Limpa rascunho
        localStorage.removeItem('rascunhoAtendimentoRPM');
      });
    }
  });

  document.addEventListener('DOMContentLoaded', function() {
    const modalEl = document.getElementById('modalNovoAtendimento');
    if (modalEl) {
      modalEl.addEventListener('show.bs.modal', function () {
        inicializarModalAtendimento();
      });

  function configurarMascarasSanitizacao() {
    const cpfBuscaHome = document.getElementById('inputCpfProntuario');
    if (cpfBuscaHome) {
      cpfBuscaHome.addEventListener('input', function() {
        if (this.value.length === 14) {
          pesquisarProntuarioHome();

      });
    }

    const cpfBuscaModal = document.getElementById('inputCpf');
    if (cpfBuscaModal) {
      cpfBuscaModal.addEventListener('input', function() {
        document.getElementById('idVitimaOculto').value = ""; // Força a buscar novamente se o CPF for alterado
        if (this.value.length === 14) {
          const inputNome = document.getElementById('inputNome');
          if (inputNome) inputNome.focus();
          pesquisarCpf();
        }
      });
    }

    const nomeInput = document.getElementById('inputNome');
    if (nomeInput) {
      nomeInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '');
      });
    }

    const telFixo = document.getElementById('tel_fixo');
    if (telFixo) {
      telFixo.addEventListener('input', function() {
        let valor = this.value.replace(/\D/g, '');
        this.value = valor.replace(/^(\d{2})(\d{4})(\d{4}).*/, '($1) $2-$3');
      });
    }

    const telCelular = document.getElementById('tel_celular');
    if (telCelular) {
      telCelular.addEventListener('input', function() {
        let valor = this.value.replace(/\D/g, '');
        this.value = valor.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
      });
    }

    const rgInput = document.getElementById('inputRg');
    if (rgInput) {
      rgInput.addEventListener('input', function() {
        let valor = this.value.replace(/[^0-9xX]/g, '').toUpperCase();
        this.value = valor.replace(/^(\d{2})(\d{3})(\d{3})([\dX]).*/, '$1.$2.$3-$4');
      });
    }
  }

  function configurarEventosViaCep() {
    try {
      const cepInput = document.getElementById('cep_vitima');
      if (cepInput) {
        // Evita duplicar listeners
        const cloneCep = cepInput.cloneNode(true);
        cepInput.parentNode.replaceChild(cloneCep, cepInput);
        
        cloneCep.addEventListener('input', function(e) {
          let valor = e.target.value.replace(/\D/g, '');
          valor = valor.replace(/^(\d{5})(\d)/, '$1-$2');
          e.target.value = valor;
          
          if (valor.length === 9) {
            preencherEnderecoPorCep(valor);
          }
        });
      }

      let timeoutViaCep = null;
      let ruasBuscadas = [];
      const ruaInput = document.getElementById('rua_vitima');
      if (ruaInput) {
        const cloneRua = ruaInput.cloneNode(true);
        ruaInput.parentNode.replaceChild(cloneRua, ruaInput);
        
        cloneRua.addEventListener('input', function(e) {
          const texto = e.target.value;
          const datalist = document.getElementById('lista-ruas');
          
          const selecionado = ruasBuscadas.find(r => r.logradouro === texto);
          if (selecionado) {
            const bairro = document.getElementById('bairro_vitima');
            const cep = document.getElementById('cep_vitima');
            if(bairro) bairro.value = selecionado.bairro;
            if(cep) {
              const cepFormatado = selecionado.cep.replace(/^(\d{5})(\d)/, '$1-$2');
              cep.value = cepFormatado;
            }
            return;
          }

          clearTimeout(timeoutViaCep);
          const cepAt = document.getElementById('cep_vitima');
          if (texto.length >= 4 && (!cepAt || !cepAt.value)) {
            timeoutViaCep = setTimeout(() => {
              fetch("https://viacep.com.br/ws/SP/Votorantim/" + texto + "/json/")
                .then(res => res.json())
                .then(data => {
                  if(datalist) datalist.innerHTML = '';
                  if (Array.isArray(data)) {
                    ruasBuscadas = data;
                    data.forEach(rua => {
                      const opt = document.createElement('option');
                      opt.value = rua.logradouro;
                      opt.textContent = "Bairro: " + rua.bairro + " - CEP: " + rua.cep;
                      if(datalist) datalist.appendChild(opt);
                    });
                  }
                })
                .catch(err => console.error("Erro Autocomplete ViaCEP:", err));
            }, 500);
          }
        });
      }
    } catch(err) {
      console.warn("Erro ao configurar ViaCEP", err);
    }
  }

  function preencherEnderecoPorCep(cep, apenasCamposVazios, exibirAviso) {
    const cepLimpo = String(cep || '').replace(/\D/g, '');
    if (cepLimpo.length !== 8) return;

    fetch("https://viacep.com.br/ws/" + cepLimpo + "/json/")
      .then(res => {
        if (!res.ok) throw new Error('Consulta de CEP indisponível');
        return res.json();
      })
      .then(data => {
        if (data.erro) {
          if (exibirAviso !== false) {
            Swal.fire('CEP não encontrado', 'Verifique os números informados e tente novamente.', 'warning');
          }
          return;
        }
        const rua = document.getElementById('rua_vitima');
        const bairro = document.getElementById('bairro_vitima');
        if (rua && (!apenasCamposVazios || !rua.value.trim())) rua.value = data.logradouro || '';
        if (bairro && (!apenasCamposVazios || !bairro.value.trim())) bairro.value = data.bairro || '';
      })
      .catch(err => {
        console.error("Erro ViaCEP:", err);
        if (exibirAviso !== false) {
          Swal.fire('Não foi possível consultar o CEP', 'Confira sua conexão e tente novamente.', 'error');
        }
      });
  }

  function pesquisarProntuarioHome(cpfConsulta) {
    const btn = document.getElementById('btnBuscarProntuario');
    const textoBotao = 'Buscar Histórico';
    const cpfInput = String(cpfConsulta || document.getElementById('inputCpfProntuario').value || '');
    const cpfLimpo = cpfInput.replace(/\D/g, '');
    const painel = document.getElementById('resultado-prontuario');

    if (cpfLimpo.length === 11 && !cpfEhValido(cpfLimpo)) {
      Swal.fire('Aten\u00e7\u00e3o', mensagemValidacaoCpf(cpfLimpo), 'warning');
      return;
    }
    
    if (cpfLimpo.length !== 11) {
      Swal.fire('Atenção', 'Por favor, digite um CPF válido com 11 caracteres numéricos.', 'warning');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Buscando...';
    painel.classList.add('d-none');
    document.getElementById('timeline-atendimentos').innerHTML = '';

    google.script.run
      .withSuccessHandler(function(resposta) {
        if (!resposta) { 
          Swal.fire('Erro Crítico', 'Resposta vazia do servidor. Verifique os logs do Apps Script.', 'error');
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) loadingScreen.classList.add('d-none');
          btn.disabled = false; btn.innerHTML = 'Buscar Histórico';
          return; 
        }

        btn.disabled = false; btn.innerHTML = textoBotao;
        
        if (resposta.status === 'erro') {
          Swal.fire('Erro no Servidor', resposta.mensagem, 'error');
          return;
        }
        
        if (resposta.status === 'nao_encontrado') {
          if (perfilSomenteLeituraAtual()) {
            Swal.fire('Consulta concluída', 'Não há prontuário cadastrado para este CPF.', 'info');
            return;
          }
          Swal.fire({
            title: 'Vítima não localizada',
            text: "Deseja iniciar um novo registo?",
            icon: 'info',
            showCancelButton: true,
            confirmButtonColor: '#0d6efd',
            confirmButtonText: 'Sim, Registar',
            cancelButtonText: 'Cancelar'
          }).then((result) => {
            if (result.isConfirmed) {
              const campoCpfRegistro = document.getElementById('inputCpf');
              if (campoCpfRegistro) {
                  campoCpfRegistro.value = cpfInput;
              }
              abrirNovoAtendimentoNormal();
            }
          });
          return;
        }

        if (resposta.erro) { Swal.fire('Erro', resposta.erro, 'error'); return; }

        document.getElementById('hist-nome').textContent = resposta.vitima.nome;
        document.getElementById('hist-idade').textContent = resposta.vitima.idade;
        document.getElementById('hist-bairro').textContent = resposta.vitima.bairro;
        
        const badgeMp = document.getElementById('hist-mp');
        badgeMp.textContent = resposta.vitima.medidaProtetiva;
        if(resposta.vitima.medidaProtetiva.includes('Concedida')) badgeMp.className = "badge bg-success";
        else if(resposta.vitima.medidaProtetiva.includes('Solicitada')) badgeMp.className = "badge bg-warning text-dark";
        else badgeMp.className = "badge bg-secondary";

        const timeline = document.getElementById('timeline-atendimentos');
        if (!resposta.historico || resposta.historico.length === 0) {
          timeline.innerHTML = '<p class="text-muted ms-2 mt-2">Nenhum atendimento na rede.</p>';
        } else {
          let html = '';
          window.historicoDetalhesDoSetor = resposta.historico.map(atend => atend.detalhesDoSetor || []);
          resposta.historico.forEach((atend, indiceAtendimento) => {
            const orgaoLow = atend.orgao.toLowerCase();
            let bc = "bg-secondary";
            if(orgaoLow.includes('pm') || orgaoLow.includes('militar')) bc = "bg-primary";
            else if(orgaoLow.includes('saúde') || orgaoLow.includes('saude')) bc = "bg-success";
            else if(orgaoLow.includes('casa da mulher')) bc = "bg-warning text-dark";
            else if(orgaoLow.includes('gcm')) bc = "bg-info text-dark";
            else if(orgaoLow.includes('pc') || orgaoLow.includes('civil')) bc = "bg-dark";
            else if(orgaoLow.includes('cras') || orgaoLow.includes('creas')) bc = "bg-danger";

            // Garante exibição de data+hora mesmo que o backend envie string ou número
            let dataExibida = atend.data || 'Data N/I';
            if (atend.dataRaw && atend.dataRaw > 0) {
              try {
                dataExibida = new Date(atend.dataRaw).toLocaleString('pt-BR', {
                  day: '2-digit', month: '2-digit', year: 'numeric',
                  hour: '2-digit', minute: '2-digit'
                });
              } catch(e) { dataExibida = atend.data || 'Data N/I'; }
            }

            // Exibe a observação livremente para a rede
            let textoObservacao = atend.observacao || atend['Observação'] || atend.Observacao || atend.observacoes || "Sem observações registradas.";

            html += `
              <div class="card bg-white shadow-sm border mb-4 ms-2 position-relative rounded">
                <div class="position-absolute" style="left: -1.75rem; top: 1.25rem;">
                  <div class="rounded-circle bg-primary" style="width: 14px; height: 14px;"></div>
                </div>
                <div class="card-body p-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold text-primary"><i class="bi bi-calendar-event me-2"></i>` + dataExibida + `</span>
                    <span class="badge rounded-pill ` + bc + ` fs-6 shadow-sm"><i class="bi bi-building me-1"></i>` + atend.orgao + `</span>
                  </div>
                  <h6 class="card-subtitle mb-2 mt-3 text-muted">Ações Resumo: ` + atend.acaoStatus + `</h6>
                  <div class="bg-light p-3 mt-3 rounded border border-light">
                    <p class="card-text small mb-0 text-dark"><strong>Observação:</strong><br>` + textoObservacao + `</p>
                  </div>
                  ` + (atend.detalhesDoSetor && atend.detalhesDoSetor.length ? `<button type="button" class="btn btn-outline-primary btn-sm mt-3" onclick="verDetalhesDoMeuOrgao(${indiceAtendimento})"><i class="bi bi-clipboard2-check me-1"></i>Ver detalhes do meu órgão</button>` : '') + `
                </div>
              </div>`;
          });
          timeline.innerHTML = html;
        }
        painel.classList.remove('d-none');
        
        // Controle de visibilidade do botão de edição cadastral.
        const btnCadastro = document.getElementById('btn-editar-dados-vitima');
        if (btnCadastro) {
          if (!perfilSomenteLeituraAtual()) {
             btnCadastro.classList.remove('d-none');
          } else {
             btnCadastro.classList.add('d-none');
          }
        }
      })
      .withFailureHandler(function(erro) {
        btn.disabled = false; btn.innerHTML = 'Buscar Histórico';
        Swal.fire('Erro no servidor', String(erro), 'error');
      })
      .consultarProntuarioIntegrado(cpfLimpo, obterTokenSessao());
  }

  function verDetalhesDoMeuOrgao(indice) {
    const detalhes = (window.historicoDetalhesDoSetor || [])[indice] || [];
    const escapar = valor => String(valor || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const campos = detalhes.map(item => {
      const grande = item.tipo === 'textarea';
      const controle = grande
        ? `<textarea class="form-control" rows="3" readonly>${escapar(item.valor)}</textarea>`
        : `<input class="form-control" value="${escapar(item.valor)}" readonly>`;
      return `<div class="${grande ? 'col-12' : 'col-md-6'} text-start"><label class="form-label fw-semibold">${escapar(item.rotulo)}</label>${controle}</div>`;
    }).join('');
    const formulario = `<div class="text-start"><div class="border-bottom pb-2 mb-3 text-secondary fw-semibold">Informações específicas do órgão</div><div class="row g-3">${campos}</div></div>`;
    Swal.fire({ title: 'Evolução do meu órgão', html: formulario || '<p>Nenhum detalhe registrado.</p>', width: 800, confirmButtonText: 'Fechar' });
  }

  function obterDataDeHojeFormatada() {
      const hoje = new Date();
      // Ajuste de fuso horário local para evitar que retorne o dia anterior à noite
      const offset = hoje.getTimezoneOffset() * 60000;
      const dataLocal = new Date(hoje.getTime() - offset);
      return dataLocal.toISOString().split('T')[0];
  }

  function abrirCorrecaoCpfVitima() {
    if (!usuarioPodeCorrigirCpf()) {
      Swal.fire('Acesso restrito', 'Somente Admin, TI ou Gestor podem corrigir o CPF de um prontuário.', 'warning');
      return;
    }

    const campoCpf = document.getElementById('cad_cpf');
    const cpfAtual = String(campoCpf && (campoCpf.dataset.valorOriginal || campoCpf.value) || '').replace(/\D/g, '');
    const modalCadastroEl = document.getElementById('modalCadastroVitima');
    const modalCadastro = modalCadastroEl ? bootstrap.Modal.getInstance(modalCadastroEl) : null;
    const reabrirCadastro = function() {
      if (!modalCadastroEl) return;
      const instancia = bootstrap.Modal.getInstance(modalCadastroEl) || new bootstrap.Modal(modalCadastroEl);
      instancia.show();
    };
    if (modalCadastro) modalCadastro.hide();
    if (cpfAtual.length !== 11) {
      reabrirCadastro();
      Swal.fire('CPF não identificado', 'Feche este cadastro e consulte novamente o prontuário antes de corrigir o CPF.', 'warning');
      return;
    }

    setTimeout(function() { Swal.fire({
      title: 'Corrigir CPF',
      html: '<p class="text-start small text-muted mb-3">Use esta função apenas quando o CPF foi digitado incorretamente. O histórico do prontuário será preservado.</p>' +
        '<label class="form-label text-start d-block small fw-semibold">Motivo da correção</label>' +
        '<textarea id="swal-motivo-correcao-cpf" class="form-control text-start" rows="2" maxlength="250" placeholder="Ex.: CPF digitado incorretamente no primeiro atendimento"></textarea>',
      input: 'text',
      inputLabel: 'Novo CPF',
      inputPlaceholder: '000.000.000-00',
      inputAttributes: { maxlength: 14, autocomplete: 'off' },
      showCancelButton: true,
      confirmButtonText: 'Corrigir CPF',
      cancelButtonText: 'Cancelar',
      confirmButtonColor: '#0d6efd',
      focusConfirm: false,
      didOpen: function() {
        const inputCpfNovo = Swal.getInput();
        if (inputCpfNovo) {
          inputCpfNovo.setAttribute('inputmode', 'numeric');
          inputCpfNovo.addEventListener('input', mascaraCPFAlfanumerico);
          inputCpfNovo.focus();
        }
      },
      preConfirm: function() {
        const novoCpf = String(Swal.getInput() && Swal.getInput().value || '').replace(/\D/g, '');
        const motivoEl = document.getElementById('swal-motivo-correcao-cpf');
        const motivo = String(motivoEl && motivoEl.value || '').trim();
        if (novoCpf.length === 11 && !cpfEhValido(novoCpf)) {
          Swal.showValidationMessage(mensagemValidacaoCpf(novoCpf));
          return false;
        }
        if (!cpfEhValido(novoCpf)) {
          Swal.showValidationMessage('Informe um CPF válido com 11 dígitos.');
          return false;
        }
        if (motivo.length < 5) {
          Swal.showValidationMessage('Informe o motivo da correção.');
          return false;
        }
        return { novoCpf: novoCpf, motivo: motivo };
      }
    }).then(function(resultado) {
      if (!resultado.isConfirmed || !resultado.value) {
        reabrirCadastro();
        return;
      }
      Swal.fire({ title: 'Corrigindo CPF...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
      google.script.run
        .withSuccessHandler(function(resposta) {
          if (!resposta || !resposta.sucesso) {
            Swal.fire('Correção não realizada', (resposta && (resposta.erro || resposta.mensagem)) || 'Não foi possível corrigir o CPF.', 'warning').then(reabrirCadastro);
            return;
          }
          const novoCpfFormatado = mascararCpf(resposta.cpfNovo);
          if (campoCpf) {
            campoCpf.dataset.valorOriginal = resposta.cpfNovo;
            campoCpf.value = novoCpfFormatado;
          }
          const busca = document.getElementById('inputCpfProntuario');
          if (busca) busca.value = formatarCpfCompleto(resposta.cpfNovo);
          const modal = bootstrap.Modal.getInstance(document.getElementById('modalCadastroVitima'));
          if (modal) modal.hide();
          Swal.fire('CPF corrigido', resposta.mensagem || 'O histórico do prontuário foi preservado.', 'success').then(function() {
            pesquisarProntuarioHome(resposta.cpfNovo);
          });
        })
        .withFailureHandler(function(erro) {
          Swal.fire('Erro na correção', String(erro), 'error').then(reabrirCadastro);
        })
        .corrigirCpfVitima(cpfAtual, resultado.value.novoCpf, resultado.value.motivo, obterTokenSessao());
    }); }, 350);
  }

  function obterComposicaoFamiliar() {
    if (document.getElementById('inputPossuiFilhos').value !== 'Sim') return [];
    return [...document.querySelectorAll('#lista-filhos [data-filho]')]
      .map(item => ({
        nome: item.querySelector('.filho-nome').value.trim(),
        idade: item.querySelector('.filho-idade').value.trim(),
        escola: item.querySelector('.filho-escola').value.trim()
      }))
      .filter(filho => filho.nome || filho.idade || filho.escola);
  }

  function abrirCadastroCompleto(modoEdicao) {
    const cpfBase = document.getElementById('inputCpfProntuario').value;
    const modalEl = document.getElementById('modalCadastroVitima');
    const modalInst = new bootstrap.Modal(modalEl);
    modalInst.show();
    const botaoCorrecao = document.getElementById('btnCorrigirCpf');
    if (botaoCorrecao) botaoCorrecao.classList.add('d-none');
    
    if (cpfBase) {
      document.getElementById('cad_cpf').value = cpfBase;
      setTimeout(() => {
        pesquisarCpfCadastroCompleto(!!modoEdicao);
      }, 500);
    }
  }

  function pesquisarCpfCadastroCompleto(modoEdicao) {
    const cpf = document.getElementById('cad_cpf').value.replace(/\D/g, '');
    if (cpf.length !== 11) return;
    
    google.script.run
      .withSuccessHandler(function(resposta) {
        if(resposta) {
           const v = resposta;
           document.getElementById('cad_idVitima').value = v.idVitima || '';
           document.getElementById('cad_cpf').dataset.valorOriginal = cpf;
           document.getElementById('cad_cpf').value = mascararCpf(cpf);
           atualizarBotaoCorrecaoCpf();
           document.getElementById('cad_nome').value = v.nome || '';
           document.getElementById('cad_nome_social').value = v.nome_social || '';
           document.getElementById('cad_preferencia_exibicao').value = v.preferencia_exibicao || 'Nome de registro';
           document.getElementById('cad_rg').value = mascararRg(v.rg);
           
           document.getElementById('cad_nascimento').value = formatarDataExibicao(v.nascimento);
           
           document.getElementById('cad_tel_fixo').value = v.tel_fixo || '';
           document.getElementById('cad_celular').value = v.tel_celular || '';
           document.getElementById('cad_cep').value = v.cep || '';
           document.getElementById('cad_rua').value = v.logradouro || '';
           document.getElementById('cad_numero').value = v.numero || '';
           document.getElementById('cad_bairro').value = v.bairro || '';
           document.getElementById('cad_raca_cor').value = 'Dado protegido';
           
           document.getElementById('cad_escolaridade').value = v.escolaridade || '';
           document.getElementById('cad_renda').value = v.renda || '';
           preencherBeneficios('cad', v);
           document.getElementById('cad_moradia').value = v.moradia || '';
           
           // Bloqueia todos os campos após preenchimento
           const form = document.getElementById('formCadastroVitima');
           const inputs = form.querySelectorAll('input');
           const selects = form.querySelectorAll('select');
           
           inputs.forEach(input => {
               if(input.id !== 'cad_cpf' && input.type !== 'hidden') {
                   if (input.type === 'checkbox') input.disabled = true;
                   else input.readOnly = true;
               }
           });
           
           selects.forEach(select => {
               select.disabled = true;
           });
           renderizarBeneficiosOutro('cad');
           
           // Garante estado inicial dos botões
           const btnEditar = document.getElementById('btnEditarCadastro');
           const btnSalvar = document.getElementById('btnSalvarCadastro');
           if (btnEditar) btnEditar.classList.remove('d-none');
           if (btnSalvar) btnSalvar.classList.add('d-none');
           if (modoEdicao) habilitarEdicaoCadastro();
        }
      })
      .buscarVitimaPorCpf(cpf, obterTokenSessao());
  }

  function habilitarEdicaoCadastro() {
      const form = document.getElementById('formCadastroVitima');
      const inputs = form.querySelectorAll('input');
      const selects = form.querySelectorAll('select');
      const camposEditaveis = [
        'cad_nome', 'cad_nome_social', 'cad_tel_fixo', 'cad_celular', 'cad_cep', 'cad_rua', 'cad_numero', 'cad_bairro',
        'cad_bolsa', 'cad_bpc', 'cad_aluguel_social_municipal', 'cad_aluguel_social_estadual', 'cad_outro_beneficio',
        'cad_outro_beneficio_texto', 'cad_outro_beneficio_descricao'
      ];
      const seletoresEditaveis = [
        'cad_preferencia_exibicao', 'cad_escolaridade', 'cad_renda', 'cad_possui_beneficio', 'cad_moradia',
        'cad_outro_beneficio_sugestao'
      ];
      
      inputs.forEach(input => {
          if (input.type === 'hidden') return;
          const podeEditar = camposEditaveis.includes(input.id);
          if (input.id === 'cad_cpf') {
            input.disabled = true;
            return;
          }
          input.disabled = false;
          if (input.type === 'checkbox') input.disabled = !podeEditar;
          else input.readOnly = !podeEditar;
      });
      
      selects.forEach(select => {
          select.disabled = !seletoresEditaveis.includes(select.id);
      });
      renderizarBeneficiosOutro('cad');
      
      const btnEditar = document.getElementById('btnEditarCadastro');
      const btnSalvar = document.getElementById('btnSalvarCadastro');
      if (btnEditar) btnEditar.classList.add('d-none');
      if (btnSalvar) btnSalvar.classList.remove('d-none');
  }

  function salvarCadastroVitimaFront() {
    const form = document.getElementById('formCadastroVitima');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    if (!validarBeneficioOutro('cad')) return;

    const btn = document.getElementById('btnSalvarCadastro');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando...';

    const formData = new FormData(form);
    const dadosObj = {};
    formData.forEach((value, key) => { dadosObj[key] = value; });
    incluirDadosBeneficios(dadosObj, 'cad');
    // Pegar valor do input desabilitado manualmente
    dadosObj['CPF'] = document.getElementById('cad_cpf').dataset.valorOriginal || document.getElementById('cad_cpf').value;

    google.script.run
      .withSuccessHandler(function(resposta) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-save me-1"></i> Salvar Cadastro';
        
        if (resposta.sucesso) {
          Swal.fire('Sucesso', 'Cadastro da vítima atualizado.', 'success');
          bootstrap.Modal.getInstance(document.getElementById('modalCadastroVitima')).hide();
        } else {
          Swal.fire('Erro', resposta.erro || 'Erro desconhecido.', 'error');
        }
      })
      .withFailureHandler(function(erro) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-save me-1"></i> Salvar Cadastro';
        Swal.fire('Erro Crítico', String(erro), 'error');
      })
      .salvarEdicaoCadastroVitima(dadosObj, obterTokenSessao());
  }
</script>
