<div id="controle-social-container" class="container mt-4 d-none">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
    <div>
      <h3 class="mb-1">Acompanhamento do Órgão</h3>
      <p class="text-muted mb-0">Consulta somente leitura das evoluções registradas pela sua unidade.</p>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm mt-3 mt-md-0" onclick="atualizarAcompanhamentoControleSocial()">
      <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
    </button>
  </div>

  <div class="card border mb-4" style="background:#ffffff;border-color:#e5e9ef!important;box-shadow:0 .35rem 1rem rgba(15,23,42,.08)!important">
    <div class="card-body py-3 d-flex flex-column flex-md-row gap-3 align-items-md-end" style="background:#ffffff">
      <div class="flex-grow-1">
        <label for="controle-social-busca" class="form-label small text-muted fw-bold mb-1">Buscar por nome ou CPF</label>
        <input id="controle-social-busca" type="search" class="form-control" placeholder="Digite o nome ou o CPF completo" oninput="aoDigitarBuscaControleSocial()">
      </div>
      <div>
        <label for="controle-social-periodo" class="form-label small text-muted fw-bold mb-1">Última evolução</label>
        <select id="controle-social-periodo" class="form-select" onchange="filtrarAcompanhamentosControleSocial()">
          <option value="">Todo o período</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>
      </div>
    </div>
  </div>

  <div id="controle-social-loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-3 mb-0">Carregando acompanhamentos...</p>
  </div>
  <div id="controle-social-resumo" class="small text-muted mb-3 d-none"></div>
  <div id="controle-social-lista" class="row g-3 d-none"></div>
</div>
